# Claude(Anthropic) 모델·비용 설정. 예제 코드는 이 파일만 읽으므로 모델 교체 시 코드 수정이 없다.
# 모델 이름은 https://platform.claude.com/docs/en/about-claude/models/overview 에서 확인한다.
# OpenAI 판(원본)은 main · isaac-sim 브랜치의 같은 파일에 있다.
models:
  chat: claude-haiku-5-5      # 대화·구조화 출력·tool calling 기본
  reasoning: claude-haiku-5-5 # 어려운 계획·보고서 (선택). 더 깊게는 claude-sonnet-5-5 · claude-opus-5-5
  vision: claude-haiku-5-5    # 카메라 프레임 이해
defaults:
  effort: low                 # low | medium | high | xhigh | max. 생각을 얼마나 할지 (temperature 대신)
  max_output_tokens: 16000    # 생각 토큰도 여기에 포함된다. 800 처럼 작으면 답이 잘린다
  timeout_s: 60
  max_retries: 2
# USD per 1M tokens. 비용 로그의 추정치에만 사용하며 실제 청구와 다를 수 있다.
# Haiku 5.5 는 입력 100K 토큰 이하 요청 기준 (넘으면 0.50 / 2.50).
pricing:
  claude-haiku-5-5: {input: 0.10, output: 0.50}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-opus-5-5: {input: 4.00, output: 20.00}
usage_log: logs/llm_usage.jsonl
